<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Landed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <style>
      /* Side-panel friendly — fluid width, scrollable content. Chrome side
       * panel default is 360px; users can drag wider. The min-width keeps
       * the layout from collapsing when used as a fallback popup. */
      html, body { width: 100%; min-width: 320px; min-height: 100vh; }
      body { padding: 32px 28px; background: var(--surface); }
      #root { display: flex; flex-direction: column; gap: 14px; max-width: 420px; margin: 0 auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
