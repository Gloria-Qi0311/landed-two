<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landed — Design System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(0.985 0.002 240);
    --surface: oklch(1 0 0);
    --surface-2: oklch(0.975 0.003 240);
    --surface-3: oklch(0.955 0.005 240);
    --fg: oklch(0.22 0.01 240);
    --fg-muted: oklch(0.55 0.01 240);
    --border: oklch(0.90 0.005 240);
    --border-subtle: oklch(0.94 0.004 240);
    --border-strong: oklch(0.82 0.008 240);
    --accent: oklch(0.48 0.13 240);
    --font-body: 'Inter', system-ui, sans-serif;
    --font-display: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); font-family: var(--font-body); color: var(--fg); -webkit-font-smoothing: antialiased; font-size: 13px; }
  .ds-layout { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
  .ds-nav { background: var(--surface-2); border-right: 0.5px solid var(--border); padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .ds-nav h1 { font-size: 14px; font-weight: 600; margin: 0 0 12px 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  .ds-nav a { display: block; padding: 4px 6px; font-size: 12px; color: var(--fg-muted); text-decoration: none; border-radius: 4px; margin-bottom: 1px; }
  .ds-nav a:hover { background: var(--surface-3); color: var(--fg); }
  .ds-nav .group-label { font-size: 10.5px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; padding: 14px 6px 4px; }
  main { padding: 40px 56px 80px; max-width: 1000px; }
  h2 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 48px 0 6px; }
  h2:first-of-type { margin-top: 24px; }
  h3 { font-size: 11px; font-weight: 600; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 24px 0 10px; }
  p.muted { color: var(--fg-muted); font-size: 12.5px; line-height: 1.55; max-width: 640px; margin: 0 0 8px; }
  code { font-family: var(--font-mono); font-size: 11px; padding: 1px 6px; background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 3px; color: var(--fg); }
  .grid { display: grid; gap: 10px; }
  .grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.cols-auto { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .btn-primary { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; font-weight: 500; background: var(--fg); color: var(--bg); border: none; border-radius: 6px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .btn-secondary { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12px; font-weight: 500; background: var(--surface); color: var(--fg); border: 0.5px solid var(--border); border-radius: 6px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .swatch { aspect-ratio: 4/3; border-radius: 6px; border: 0.5px solid var(--border); padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .swatch .name { font-size: 11.5px; font-weight: 600; }
  .swatch .val { font-size: 9.5px; font-family: var(--font-mono); color: var(--fg-muted); }
  .swatch.dark { color: white; }
  .swatch.dark .val { color: rgba(255,255,255,0.7); }
  .type-row { padding: 10px 12px; border-radius: 6px; background: var(--surface); border: 0.5px solid var(--border); display: flex; align-items: baseline; gap: 16px; margin-bottom: 4px; }
  .type-row .label { font-size: 10px; font-family: var(--font-mono); color: var(--fg-muted); text-transform: uppercase; min-width: 90px; }
  .type-row .meta { font-size: 10px; color: var(--fg-muted); margin-left: auto; font-family: var(--font-mono); }
  .ico-tile { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 6px; border-radius: 5px; background: var(--surface); border: 0.5px solid var(--border); }
  .ico-tile .lbl { font-size: 10px; font-family: var(--font-mono); color: var(--fg-muted); }
  .stages-strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; }
  .pattern-diagram { padding: 18px; background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.7; color: var(--fg); white-space: pre; overflow-x: auto; }
  .note { padding: 10px 14px; background: var(--surface-2); border-left: 2px solid var(--accent); border-radius: 4px; font-size: 12px; color: var(--fg-muted); margin: 8px 0; line-height: 1.55; }
  table.tokens { width: 100%; border-collapse: collapse; }
  table.tokens td, table.tokens th { padding: 7px 10px; font-size: 11.5px; text-align: left; border-bottom: 0.5px solid var(--border-subtle); }
  table.tokens th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-muted); font-weight: 600; border-bottom: 0.5px solid var(--border); }
  table.tokens td:first-child { font-family: var(--font-mono); color: var(--fg-muted); width: 220px; }
  table.tokens td:nth-child(2) { font-family: var(--font-mono); font-size: 11px; }
  .preview { width: 36px; height: 18px; border-radius: 4px; border: 0.5px solid var(--border); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="components/primitives.jsx"></script>

<script type="text/babel">
const COLOR_TOKENS = [
  { name: '--bg',            hex: 'oklch(0.985 0.002 240)', role: 'Page background' },
  { name: '--surface',       hex: 'oklch(1 0 0)',           role: 'Cards, drawers, popovers' },
  { name: '--surface-2',     hex: 'oklch(0.975 0.003 240)', role: 'Inset / nested surface' },
  { name: '--surface-3',     hex: 'oklch(0.955 0.005 240)', role: 'Hover / selected nav' },
  { name: '--fg',            hex: 'oklch(0.22 0.01 240)',   role: 'Primary text', dark: true },
  { name: '--fg-muted',      hex: 'oklch(0.55 0.01 240)',   role: 'Secondary text', dark: true },
  { name: '--border',        hex: 'oklch(0.90 0.005 240)',  role: 'Default 0.5px border' },
  { name: '--accent',        hex: 'oklch(0.48 0.13 240)',   role: 'Links, focus', dark: true },
];

const TYPE_SCALE = [
  { size: 22, label: 'Display', use: 'Marketing / DS section heads',         sample: 'Land your next role.' },
  { size: 18, label: 'Page title', use: 'PageHeader',                         sample: 'Applications' },
  { size: 14, label: 'Section title', use: 'Card headings',                   sample: 'Must-have requirements' },
  { size: 12.5, label: 'Body', use: 'Default text, table cells',              sample: 'Senior Frontend Engineer · Northwind' },
  { size: 12, label: 'Body small', use: 'Buttons, tab labels',                sample: 'Save response' },
  { size: 11.5, label: 'Caption', use: 'Subtitles, secondary captions',       sample: '12 of 44 · across 8 companies' },
  { size: 11, label: 'Micro', use: 'Status labels, timestamps',               sample: 'sent 11:18 AM' },
  { size: 10.5, label: 'Eyebrow', use: 'Uppercase section labels',            sample: 'PIPELINE', upper: true },
];

const ICONS = ['kanban','table','timeline','cards','map','search','plus','chevronDown','chevronRight','external','star','filter','sort','bell','sparkle','doc','target','adjust','refresh','link','calendar','alert','check','x','dots','inbox','wand','settings','arrowRight'];

function App() {
  return (
    <div className="ds-layout">
      <nav className="ds-nav">
        <h1><LandedMark size={18} /> Landed DS</h1>
        <div className="group-label">Foundations</div>
        <a href="#colors">Colors</a>
        <a href="#stages">Stage colors</a>
        <a href="#typography">Typography</a>
        <a href="#spacing">Spacing & radii</a>
        <a href="#icons">Iconography</a>
        <div className="group-label">Components</div>
        <a href="#buttons">Buttons</a>
        <a href="#inputs">Inputs</a>
        <a href="#stage-badge">StageBadge</a>
        <a href="#company-mark">CompanyMark</a>
        <a href="#portal-dot">PortalDot</a>
        <a href="#page-header">PageHeader</a>
        <a href="#model-card">AI ModelCard</a>
        <a href="#diff">DiffBullet</a>
        <div className="group-label">Patterns</div>
        <a href="#roundtrip">AI Round-trip</a>
        <a href="#portal-sync">Portal Sync</a>
        <div className="group-label">Reference</div>
        <a href="index.html">↗ Live product</a>
        <a href="how-it-works.html">↗ Storyboard</a>
        <a href="spec.md">↗ Functional spec</a>
      </nav>

      <main>
        <header style={{ paddingBottom: 24, borderBottom: '0.5px solid var(--border)' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18 }}>
            <LandedMark size={26} />
            <span style={{ fontSize: 16, fontWeight: 600, letterSpacing: '-0.02em' }}>Landed</span>
            <span style={{ fontSize: 11.5, color: 'var(--fg-muted)' }}>Design System v0.4</span>
          </div>
          <div style={{ fontSize: 30, fontWeight: 600, letterSpacing: '-0.025em', lineHeight: 1.15, marginBottom: 10, maxWidth: 640 }}>
            The visual + interaction language behind Landed.
          </div>
          <p className="muted">
            Tokens, components, and patterns the product depends on. The live product is <code>index.html</code>; the extension storyboard is <code>how-it-works.html</code>; the behavioral spec is <code>spec.md</code>.
          </p>
        </header>

        {/* Colors */}
        <h2 id="colors">Colors</h2>
        <p className="muted">All colors use <code>oklch()</code> for perceptual uniformity. Tokens are CSS variables on <code>:root</code>. Theme variants (Cool / Warm / Editorial / Dark) override these — see <code>index.html</code>.</p>
        <div className="grid cols-auto" style={{ marginTop: 12 }}>
          {COLOR_TOKENS.map(c => (
            <div key={c.name} className={`swatch ${c.dark ? 'dark' : ''}`} style={{ background: c.hex }}>
              <div className="name">{c.role}</div>
              <div className="val">{c.name}</div>
            </div>
          ))}
        </div>

        <h3 id="stages">Stage colors</h3>
        <p className="muted">Each pipeline stage has a 4-color set: <code>bg</code> / <code>fg</code> / <code>dot</code> / <code>ring</code>. Hue rotates ~30° per stage.</p>
        <div className="stages-strip">
          {STAGES.map(s => <StageBadge key={s.id} stage={s.id} />)}
        </div>

        {/* Typography */}
        <h2 id="typography">Typography</h2>
        <p className="muted">Inter at 400 / 500 / 600. JetBrains Mono for tabular numerics, IDs, timestamps, code. Optional Instrument Serif for Editorial theme display headings.</p>
        {TYPE_SCALE.map(t => (
          <div className="type-row" key={t.size}>
            <span className="label">{t.label}</span>
            <span style={{
              fontSize: t.size,
              fontWeight: t.size >= 18 ? 600 : 500,
              letterSpacing: t.size >= 18 ? '-0.02em' : 'normal',
              textTransform: t.upper ? 'uppercase' : 'none',
            }}>{t.sample}</span>
            <span className="meta">{t.size}px · {t.use}</span>
          </div>
        ))}

        {/* Spacing */}
        <h2 id="spacing">Spacing & radii</h2>
        <table className="tokens">
          <thead><tr><th>Token</th><th>Value</th><th>Used for</th></tr></thead>
          <tbody>
            <tr><td>radius/sm</td><td>4px</td><td>Tag chips, inline badges</td></tr>
            <tr><td>radius/md</td><td>6px</td><td>Buttons, inputs, small cards</td></tr>
            <tr><td>radius/lg</td><td>8px</td><td>Standard cards</td></tr>
            <tr><td>radius/xl</td><td>10px</td><td>Main panels, drawers</td></tr>
            <tr><td>radius/round</td><td>999px</td><td>StageBadges, pills</td></tr>
            <tr><td>border/hairline</td><td>0.5px</td><td>All standard borders</td></tr>
            <tr><td>page padding</td><td>14px 28px 12px (header) / 16px 28px 24px (body)</td><td>Every top-level page</td></tr>
            <tr><td>shadow/drawer</td><td>-12px 0 40px rgba(0,0,0,0.08)</td><td>DetailDrawer</td></tr>
            <tr><td>shadow/popover</td><td>0 12px 40px rgba(0,0,0,0.18)</td><td>Floating panels</td></tr>
          </tbody>
        </table>

        {/* Iconography */}
        <h2 id="icons">Iconography</h2>
        <p className="muted">24×24 viewBox, 1.5 stroke (2 for emphasis). Optical sizes: 11 (inline), 13 (button), 14 (sidebar), 16 (toolbar).</p>
        <div className="grid cols-auto" style={{ marginTop: 12 }}>
          {ICONS.map(n => (
            <div key={n} className="ico-tile">
              <Icon name={n} size={18} />
              <span className="lbl">{n}</span>
            </div>
          ))}
        </div>

        {/* Buttons */}
        <h2 id="buttons">Buttons</h2>
        <div style={{ padding: 16, background: 'var(--surface)', border: '0.5px solid var(--border)', borderRadius: 8, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button className="btn-primary"><Icon name="plus" size={13} stroke={2} /> Primary</button>
          <button className="btn-secondary"><Icon name="filter" size={13} /> Secondary</button>
          <button className="btn-secondary"><Icon name="external" size={13} /> Open in portal</button>
          <button className="btn-secondary" style={{ padding: 6 }}><Icon name="dots" size={14} /></button>
          <button className="btn-secondary" disabled style={{ opacity: 0.4, cursor: 'not-allowed' }}>Disabled</button>
        </div>

        {/* Inputs */}
        <h2 id="inputs">Inputs</h2>
        <div style={{ padding: 16, background: 'var(--surface)', border: '0.5px solid var(--border)', borderRadius: 8, display: 'flex', gap: 8 }}>
          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: 8, top: 7, color: 'var(--fg-muted)' }}><Icon name="search" size={13} /></span>
            <input type="text" placeholder="Search…" style={{ width: 220, background: 'var(--surface)', color: 'var(--fg)', border: '0.5px solid var(--border)', borderRadius: 6, padding: '5px 10px 5px 28px', fontSize: 12, outline: 'none', fontFamily: 'inherit' }} />
          </div>
          <input type="text" placeholder="Default" style={{ width: 220, background: 'var(--surface)', color: 'var(--fg)', border: '0.5px solid var(--border)', borderRadius: 6, padding: '5px 10px', fontSize: 12, outline: 'none', fontFamily: 'inherit' }} />
        </div>

        {/* StageBadge */}
        <h2 id="stage-badge">StageBadge</h2>
        <p className="muted">Colored pill rendering any pipeline stage. Used in tables, drawer, activity feed, model cards.</p>
        <div className="stages-strip" style={{ gap: 8 }}>
          {STAGES.map(s => <StageBadge key={s.id} stage={s.id} />)}
        </div>

        {/* CompanyMark */}
        <h2 id="company-mark">CompanyMark</h2>
        <p className="muted">Stable per-company monogram derived from <code>hue</code> (0–360) and 2-char <code>logo</code>. Sizes: 14 / 18 / 22 / 26 / 36 / 40.</p>
        <div style={{ padding: 16, background: 'var(--surface)', border: '0.5px solid var(--border)', borderRadius: 8, display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap' }}>
          {COMPANIES.slice(0, 8).map(c => (
            <div key={c.id} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
              <CompanyMark company={c} size={36} />
              <span style={{ fontSize: 10.5, color: 'var(--fg-muted)' }}>{c.name.split(' ')[0]}</span>
            </div>
          ))}
        </div>

        {/* PortalDot */}
        <h2 id="portal-dot">PortalDot</h2>
        <p className="muted">Status indicator for extension sync. Green = active. Orange (pulsing) = expired.</p>
        <div style={{ padding: 16, background: 'var(--surface)', border: '0.5px solid var(--border)', borderRadius: 8, display: 'flex', gap: 24 }}>
          <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}><PortalDot companyId="c01" /> Active</span>
          <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12 }}><PortalDot companyId="c03" /> Expired (pulsing)</span>
        </div>

        {/* PageHeader */}
        <h2 id="page-header">PageHeader</h2>
        <p className="muted">Every top-level page uses this shape: 18px title / 600, 11.5px subtitle, right-aligned action cluster. Padding <code>14px 28px 12px</code>, bottom hairline border.</p>
        <div style={{ padding: '14px 28px 12px', border: '0.5px solid var(--border)', borderRadius: 8, display: 'flex', alignItems: 'center', gap: 10 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 600, letterSpacing: '-0.02em' }}>Applications</div>
            <div style={{ fontSize: 11.5, color: 'var(--fg-muted)', marginTop: 1 }}>12 of 44 · across 8 companies</div>
          </div>
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
            <button className="btn-secondary"><Icon name="filter" size={13} /> Filter</button>
            <button className="btn-primary"><Icon name="plus" size={13} stroke={2} /> Add</button>
          </div>
        </div>

        {/* Model Card */}
        <h2 id="model-card">AI ModelCard</h2>
        <p className="muted">The 3-AI strip used in Resume Match and JD Breakdown. Same shape, content varies by state: <code>idle / awaiting / parsing / parsed / failed</code>.</p>
        <div className="grid cols-3" style={{ marginTop: 12 }}>
          {[
            { name: 'ChatGPT', model: 'GPT-4o', color: 'oklch(0.55 0.13 155)', label: 'Parsed', sub: '4 JDs · sent 11:02', icon: 'check', iconColor: 'oklch(0.45 0.13 155)', stroke: 2, btn: 'Re-run', btnIcon: 'refresh' },
            { name: 'Claude',  model: 'Sonnet 4.5', color: 'oklch(0.58 0.14 40)', label: 'Awaiting paste', sub: 'sent 11:18', icon: 'inbox', iconColor: 'oklch(0.50 0.14 245)', stroke: 1.75, btn: 'Paste below', btnIcon: null },
            { name: 'Gemini',  model: '2.0 Pro', color: 'oklch(0.55 0.13 255)', label: 'Parse failed', sub: '', icon: 'alert', iconColor: 'oklch(0.50 0.16 30)', stroke: 1.75, btn: 'Try again', btnIcon: 'refresh' },
          ].map(p => (
            <div key={p.name} style={{ background: 'var(--surface)', border: '0.5px solid var(--border)', borderRadius: 8, padding: 12 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                <span style={{ width: 9, height: 9, borderRadius: 5, background: p.color }} />
                <span style={{ fontSize: 13, fontWeight: 600 }}>{p.name}</span>
                <span style={{ fontSize: 10.5, color: 'var(--fg-muted)', fontFamily: 'var(--font-mono)' }}>{p.model}</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, color: p.iconColor, marginBottom: 8 }}>
                <Icon name={p.icon} size={12} stroke={p.stroke} />
                <span style={{ fontWeight: 500 }}>{p.label}</span>
                {p.sub && <span style={{ marginLeft: 'auto', fontSize: 10.5, color: 'var(--fg-muted)', fontFamily: 'var(--font-mono)' }}>{p.sub}</span>}
              </div>
              <button className="btn-secondary" style={{ width: '100%', justifyContent: 'center', fontSize: 11.5, padding: '5px 8px' }}>
                {p.btnIcon && <Icon name={p.btnIcon} size={11} />} {p.btn}
              </button>
            </div>
          ))}
        </div>

        {/* Diff */}
        <h2 id="diff">DiffBullet</h2>
        <p className="muted">Used in Resume Tailor. Original (strikethrough) above tailored version with inline segment highlighting.</p>
        <div style={{ background: 'var(--surface)', border: '0.5px solid var(--border)', borderRadius: 8, padding: '12px 14px' }}>
          <div style={{ fontSize: 10.5, color: 'var(--fg-muted)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600, marginBottom: 6 }}>Senior Engineer · Northwind · 2022–Present</div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 4 }}>
            <span style={{ width: 14, fontSize: 10.5, color: 'var(--fg-muted)', fontFamily: 'var(--font-mono)' }}>–</span>
            <div style={{ fontSize: 12.5, lineHeight: 1.5, color: 'var(--fg-muted)', textDecoration: 'line-through', textDecorationThickness: '0.5px' }}>
              Built component library used by 12 product teams.
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <span style={{ width: 14, fontSize: 10.5, color: 'oklch(0.5 0.14 155)', fontFamily: 'var(--font-mono)', fontWeight: 600 }}>+</span>
            <div style={{ fontSize: 12.5, lineHeight: 1.5 }}>
              Built <span style={{ background: 'oklch(0.94 0.06 155)', color: 'oklch(0.32 0.13 155)', padding: '0 2px', borderRadius: 3, boxShadow: 'inset 0 -1px 0 oklch(0.7 0.13 155)' }}>React + TypeScript </span>
              component library used by 12 product teams
              <span style={{ background: 'oklch(0.94 0.06 155)', color: 'oklch(0.32 0.13 155)', padding: '0 2px', borderRadius: 3, boxShadow: 'inset 0 -1px 0 oklch(0.7 0.13 155)' }}> and integrated with cross-functional design + product partners</span>.
            </div>
          </div>
        </div>

        {/* AI Roundtrip */}
        <h2 id="roundtrip">AI Round-trip pattern</h2>
        <p className="muted">Used in Resume Match (rank JDs) and JD Breakdown (tailor resume). Same primitive, different prompts and parsers. No API keys needed — route the user's prompt through their existing AI subscription, paste the response back, parse with progressively-relaxed heuristics.</p>
        <div className="pattern-diagram">{`
  [generate prompt for current task]
       ↓
  [user clicks "Launch ChatGPT/Claude/Gemini"]
       ↓
  [copy prompt to clipboard] + [window.open(ai_url, '_blank')]
       ↓
  [model card flips to "awaiting paste"]
       ↓
  [user pastes AI response into our paste panel]
       ↓
  [tryParseResponse]
       ├─ JSON parse                 → success
       ├─ Markdown table heuristic   → success
       └─ Plain text fallback        → "couldn't parse" + manual fixer
       ↓
  [save → model card flips to "parsed"]
       ↓
  [comparison view updates with new data]
`}</div>
        <div className="note">
          <strong>Why three-tier parsing?</strong> Users won't reliably ask AIs for JSON. We try JSON first (best case), markdown tables second, plain text last. If everything fails, the recovery UI lets the user paste again or fix by hand.
        </div>

        {/* Portal Sync */}
        <h2 id="portal-sync">Portal Sync pattern</h2>
        <p className="muted">The browser extension piggybacks on existing portal logins (Greenhouse, Lever, Workday, BOSS Zhipin) and runs a background scrape every 6 hours.</p>
        <div className="pattern-diagram">{`
  [user already logged into careers portal]
       ↓
  [content script reads DOM, finds applications]
       ↓
  [service worker schedules 6-hour periodic scan]
       ↓
  [scan diffs DOM snapshot against last]
       ├─ status change      → push event + desktop notification
       ├─ no change          → silent
       └─ cookie expired     → notify user, surface re-auth UI
`}</div>
        <div className="note">
          <strong>Privacy.</strong> Portal cookies never leave the browser. Only parsed fields (role, stage, dates) sync through Landed. Full walkthrough in <a href="how-it-works.html">how-it-works.html</a>.
        </div>

        <footer style={{ marginTop: 60, paddingTop: 24, borderTop: '0.5px solid var(--border)', fontSize: 11.5, color: 'var(--fg-muted)' }}>

        </footer>
      </main>
    </div>
  );
}
